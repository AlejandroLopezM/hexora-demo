<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>HEXORA · Navegación</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Módulos" style="box-sizing: border-box; width: 100%; min-height: 100vh; background: #FFFFFF; border-right: 1px solid #DCDFD9; display: flex; flex-direction: column; gap: 2px; padding: 20px 12px; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1B1F1D; font-size: 14px">
  <a href="Inicio.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; color: #1B1F1D; text-decoration: none">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 2l10 5.75v11.5L13 25 3 19.25V7.75z" fill="none" stroke="#1F5F4A" stroke-width="2"/><path d="M8 10v6M18 10v6M8 13h10" stroke="#1F5F4A" stroke-width="2"/></svg>
    <span style="font-weight: 600; letter-spacing: 0.08em">HEXORA</span>
  </a>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
    <div style="font-size: 11px; font-weight: 600; color: #5C635F; padding: 14px 10px 6px; letter-spacing: 0.06em">{{ g.label }}</div>
    <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
      <a href="{{ it.href }}" aria-current="{{ it.current }}" style="{{ it.style }}">
        <span>{{ it.label }}</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5C635F">{{ it.key }}</span>
      </a>
    </sc-for>
  </sc-for>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px 10px 0; border-top: 1px solid #DCDFD9">
    <span style="font-size: 12px; color: #5C635F; line-height: 1.5">Datos ficticios · prototipo sin API</span>
    <a href="Login.dc.html" style="font-size: 13px; color: #1F5F4A">Cerrar sesión</a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["inicio","cartera","contabilidad","tesoreria","inmobiliaria","nomina"],"default":"cartera"},"$preview":{"width":232,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'cartera';
    var base = 'display: flex; justify-content: space-between; align-items: center; padding: 9px 10px; border-radius: 6px; text-decoration: none; ';
    var mk = function (id, label, href, key) {
      var on = id === active;
      return {
        label: label, href: href, key: key,
        current: on ? 'page' : 'false',
        style: base + (on ? 'background: #E6EFEA; color: #123D2F; font-weight: 600' : 'color: #1B1F1D')
      };
    };
    return {
      groups: [
        { label: 'GENERAL', items: [mk('inicio', 'Inicio', 'Inicio.dc.html', 'G I')] },
        { label: 'FINANZAS', items: [
          mk('cartera', 'Cartera CxC', 'Cartera.dc.html', 'G C'),
          mk('contabilidad', 'Contabilidad', 'Contabilidad.dc.html', 'G A'),
          mk('tesoreria', 'Tesorería', 'Tesoreria.dc.html', 'G T')
        ] },
        { label: 'OPERACIÓN', items: [
          mk('inmobiliaria', 'Inmobiliaria', 'Inmobiliaria.dc.html', 'G M'),
          mk('nomina', 'Nómina', 'Nomina.dc.html', 'G N')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
